<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312e81" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#pwaGrad)" filter="url(#shadow)" />
  <!-- Center S Symbol -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
  <!-- Emerald Split Dot -->
  <circle cx="390" cy="120" r="36" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="8" />
</svg>
