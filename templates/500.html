{% extends "splitter/base.html" %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center space-y-6 bg-white dark:bg-slate-900 p-8 sm:p-10 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl animate-card-enter">
    <div class="w-16 h-16 mx-auto rounded-3xl bg-rose-50 dark:bg-rose-950/70 border border-rose-200/80 dark:border-rose-800/80 flex items-center justify-center text-3xl">
      <svg class="w-8 h-8 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    
    <div class="space-y-2">
      <span class="inline-block px-3 py-1 rounded-full text-xs font-bold font-mono tracking-wider bg-rose-100 dark:bg-rose-950/80 text-rose-700 dark:text-rose-300 uppercase">
        Error 500
      </span>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
        Server Error
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
        Something unexpected occurred while processing this request. Our system has logged the event.
      </p>
    </div>

    <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="{% url 'splitwise_dashboard' %}"
         class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-sm shadow-indigo-200 dark:shadow-none transition">
        &larr; Back to Dashboard
      </a>
      <button onclick="window.history.back()"
         class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-semibold transition cursor-pointer">
        Go Back
      </button>
    </div>
  </div>
</div>
{% endblock %}
