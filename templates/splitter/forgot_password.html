{% extends "splitter/base.html" %}
{% load static %}
{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-10 space-y-6 animate-card-enter">
  <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl p-7 sm:p-8 space-y-6">
    <div class="text-center space-y-3">
      <div class="inline-flex items-center justify-center p-2 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm mx-auto">
        <img src="{% static 'icons/splitflow_logo.png' %}" alt="SplitFlow Logo" class="w-14 h-14 rounded-xl object-contain shadow-sm" />
      </div>
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Reset Your Password</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your username or email address to set a new password</p>
      </div>
    </div>

    {% if error_msg %}
      <div class="p-3.5 rounded-xl text-xs font-semibold bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300">
        {{ error_msg }}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username or Email</label>
        <input id="reset_identifier" type="text" name="identifier" required placeholder="Enter your username or email"
               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">New Password</label>
        <input type="password" name="new_password" required placeholder="Minimum 4 characters"
               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Confirm New Password</label>
        <input type="password" name="confirm_password" required placeholder="Re-enter new password"
               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit"
              class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-md shadow-indigo-200 dark:shadow-none transition cursor-pointer">
        Update Password &rarr;
      </button>
    </form>

    <div class="text-center text-xs text-slate-500 dark:text-slate-400 pt-1">
      Remember your password?
      <a href="{% url 'login' %}" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline ml-1">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
