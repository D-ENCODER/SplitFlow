{% extends "splitter/base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-10 space-y-6 animate-card-enter">
  <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl p-7 sm:p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white font-bold text-xl flex items-center justify-center mx-auto shadow-md shadow-indigo-200 dark:shadow-none">
        S
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Create an Account</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">Join the household SplitFlow expense ledger</p>
    </div>

    {% if error_msg %}
      <div class="p-3.5 rounded-xl text-xs font-semibold bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300">
        {{ error_msg }}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Full Name</label>
        <input type="text" name="full_name" required placeholder="e.g. Het, Ruchit, Tirth, Maurya"
               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
        <input type="text" name="username" required placeholder="e.g. het, ruchit, tirth"
               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
        <input type="email" name="email" placeholder="name@splitflow.local"
               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
          <input type="password" name="password" required placeholder="••••••••"
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Confirm</label>
          <input type="password" name="password_confirm" required placeholder="••••••••"
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <button type="submit"
              class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-md shadow-indigo-200 dark:shadow-none transition cursor-pointer">
        Create Account &rarr;
      </button>
    </form>

    <div class="text-center text-xs text-slate-500 dark:text-slate-400 pt-1">
      Already have an account?
      <a href="{% url 'login' %}" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline ml-1">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
